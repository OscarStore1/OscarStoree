<html>
<head>
<meta charset="utf-8">
<title>Ramadan Decor</title>
<style>
body { text-align: center; background: #fff8ee; }
img { width: 200px; margin: 8px; border-radius: 12px; }
</style>
</head>
<body>
<h1>Ramadan Decor</h1>
<p>All Photos Here</p>
<div id="gallery"></div>

<script>
fetch("https://api.github.com/repos/oa4172724-del/OscarStoree/git/trees/main?recursive=1&t=" + Date.now())
.then(r => r.json())
.then(data => {
  data.tree.forEach(f => {
    let name = f.path.toLowerCase();
    if (name.endsWith(".jpg")  name.endsWith(".jpeg")  name.endsWith(".png") || name.endsWith(".webp")) {
      let img = document.createElement("img");
      img.src = "https://raw.githubusercontent.com/oa4172724-del/OscarStoree/main/" + encodeURIComponent(f.path);
      img.loading = "lazy";
      document.getElementById("gallery").appendChild(img);
    }
  });
});
</script>
</body>
</html>
