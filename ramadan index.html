<html>
<head>
  <title>ديكور رمضان</title>
  <style>
    body { text-align: center; background: #fff8ee; }
    h1 { font-size: 30px; }
    img { width: 200px; margin: 8px; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>ديكور رمضان</h1>
  <p>كل صور الديكور هنا</p>
  <div id="gallery"></div>

  <script>
    fetch("https://api.github.com/repos/oa4172724-del/OscarStoree/contents/?t=" + Date.now())
      .then(r => r.json())
      .then(files => {
        files.forEach(f => {
          if (f.name.toLowerCase().endsWith(".jpg")  f.name.toLowerCase().endsWith(".jpeg")  f.name.toLowerCase().endsWith(".png")) {
            let img = document.createElement("img");
            img.src = f.name;
            document.getElementById("gallery").appendChild(img);
          }
        });
      });
  </script>
</body>
</html>
