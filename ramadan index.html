<html><body>
<h1>اختبار الاسامي</h1>
<div id="x"></div>
<script>
fetch("https://api.github.com/repos/OscarStore1/OscarStoree/git/trees/main?recursive=1&t="+Date.now())
.then(r=>r.json()).then(d=>{
  let names = d.tree.filter(f=>f.path.toLowerCase().endsWith(".jpg")).map(f=>f.path);
  names.reverse();
  document.getElementById("x").innerHTML = "العدد: "+names.length+"<br><br>" + names.slice(0,20).join("<br>");
});
</script>
</body></html>
