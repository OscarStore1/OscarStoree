<html><head><meta charset="utf-8"><title>Ramadan</title>
<style>body{text-align:center;background:#fff8ee}img{width:200px;margin:8px;border-radius:12px}button{padding:15px 30px;font-size:20px;margin:20px;background:#ff8c00;color:white;border:none;border-radius:10px}</style>
</head><body>
<h1>Ramadan Decor</h1>
<div id="count"></div>
<div id="gallery"></div>
<button id="more" onclick="showMore()">عرض المزيد</button>
<script>
let all=[]; let shown=0;
fetch("https://api.github.com/repos/OscarStore1/OscarStoree/git/trees/main?recursive=1&t="+Date.now())
.then(r=>r.json()).then(d=>{
  all=d.tree.filter(f=>f.path.toLowerCase().endsWith(".jpg")||f.path.toLowerCase().endsWith(".png"));
  all.reverse();
  document.getElementById("count").innerText="عندنا "+all.length+" صورة";
  showMore();
});
function showMore(){
  for(let i=0;i<50 && shown<all.length;i++,shown++){
    let img=document.createElement("img");
    img.src="https://raw.githubusercontent.com/OscarStore1/OscarStoree/main/"+all[shown].path;
    img.loading="lazy";
    document.getElementById("gallery").appendChild(img);
  }
  if(shown>=all.length) document.getElementById("more").style.display="none";
}
</script></body></html>
