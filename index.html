<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمضان - Oscar Store</title>
<style>
body{font-family:Arial;background:#fff8e7;margin:0;padding:15px}
h1{text-align:center;color:#b8860b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center;padding-bottom:8px}
.card img{width:100%;height:180px;object-fit:cover}
.card p{font-size:13px;margin:8px 5px;color:#333}
a{color:#b8860b}
#status{text-align:center;margin:10px}
</style>
</head>
<body>
<h1>🌙 فوانيس رمضان - Oscar Store</h1>
<p style="text-align:center"><a href="index.html">⬅ الرجوع للرئيسية</a></p>
<div id="status">جاري تحميل الصور...</div>
<div class="grid" id="grid"></div>
<script>
fetch("https://api.github.com/repos/OscarStore1/OscarStoree/git/trees/main?recursive=1&t="+Date.now())
.then(r=>r.json()).then(d=>{
  let all = d.tree.filter(f=> f.path.toLowerCase().endsWith(".jpg") || f.path.toLowerCase().endsWith(".png"))
  .filter(f=> !f.path.includes("590806631") && !f.path.toLowerCase().includes("watermarked") && !f.path.toLowerCase().includes("copy"));
  document.getElementById("status").innerHTML = "لقيت " + all.length + " صورة";
  document.getElementById("grid").innerHTML = all.map(f=>`
    <div class="card">
      <img loading="lazy" src="${f.path}" onerror="this.src='https://raw.githubusercontent.com/OscarStore1/OscarStoree/main/${f.path}'">
      <p>${f.path.split("/").pop().replace(/[-_]/g," ")}</p>
      <p style="color:#b8860b;font-weight:bold">اسأل عن السعر في المحل</p>
    </div>`).join("");
}).catch(e=>{ document.getElementById("status").innerHTML = "فيه مشكلة: "+e; });
</script>
</body>
</html>
